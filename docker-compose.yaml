services:
  db:
    image: postgres:16-alpine
    container_name: urlshortener_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - urlshortener_db_data:/var/lib/postgresql/data
    networks:
      - urlshortener_network

  redis:
    image: redis:8.6.4-alpine3.23
    container_name: urlshortener_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --save 60 1
      --loglevel warning
    volumes:
      - urlshortener_redis_data:/data
    networks:
      - urlshortener_network


volumes:
  urlshortener_db_data:
    driver: local

  urlshortener_redis_data:
    driver: local


networks:
  urlshortener_network:
    name: urlshortener_network
    driver: bridge