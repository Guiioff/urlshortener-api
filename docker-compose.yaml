services:
  db:
    image: postgres:16-alpine
    container_name: urlshortener_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - urlshortener_db_data:/var/lib/postgresql/data

volumes:
  urlshortener_db_data:
